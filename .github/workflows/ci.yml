name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[validation]"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Verify JSON schemas
        run: |
          python -m json.tool schemas/v1/issue-input.schema.json > /dev/null
          python -m json.tool schemas/v1/transcript-event.schema.json > /dev/null
          python -m json.tool examples/issue.json > /dev/null
          python tools/validate_schemas.py
      - name: CLI smoke checks
        run: |
          amk --version
          amk doctor . --min-score 100
          amk transcript examples/transcript.jsonl --config examples/amk.config.json
          amk report . --transcript examples/transcript.jsonl --format json
          amk comment . --transcript examples/transcript.jsonl
          amk triage examples/issue.json
          amk triage examples/issue.json --format json
          amk release . --transcript examples/transcript.jsonl --version 0.1.0
      - name: Verify input-error exit code
        run: |
          set +e
          amk transcript /does/not/exist.jsonl
          status=$?
          set -e
          test "$status" -eq 2
